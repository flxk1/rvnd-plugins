name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  marketplace-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: pinned RVND source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: flxk1/RVND
          ref: 8119418dd10eafcd6530774e488759626e6367f8
          path: rvnd-source
      - name: supply-chain gate teeth
        run: python3 tools/supply_chain_gate.py --self-test
      - name: marketplace/source coherence
        run: python3 tools/marketplace_gate.py --source-root rvnd-source
